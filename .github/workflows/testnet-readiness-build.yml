name: Testnet Readiness Build

on:
  push:
    branches:
      - testnet-mainnet-readiness

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: VesselNFT contract tests
        run: npm run contract:test
      - name: Phase D helper syntax
        run: npm run phase-d:check
      - name: Build
        run: npm run build
