name: D17 Custom Lighthouse Gateway Audit

on:
  push:
    branches:
      - audit/d15-seed-readback

jobs:
  d17-custom-gateway-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Verify metadata and artwork through custom Lighthouse gateway
        env:
          GATEWAY: 'https://pleased-jellyfish-6s9j4.lighthouseweb3.xyz/ipfs'
          METADATA_CID: 'bafybeiaawsoktrjvewjv4emu7bxsoyctftxtkmglardz3cex335c25b3ci'
          IMAGE_CID: 'QmPax47qCinP2c6hj77F4CBvB74VHsas2j8Dqa3TdGphZq'
        run: |
          set -euo pipefail
          echo "D17 CUSTOM LIGHTHOUSE GATEWAY AUDIT"
          echo "READ_ONLY: YES"

          META_URL="$GATEWAY/$METADATA_CID/1.json"
          IMAGE_URL="$GATEWAY/$IMAGE_CID/Vessel_0007.png"

          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 35 \
            "$META_URL" -o /tmp/1.json

          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('/tmp/1.json', 'utf8'));
          if (m.image !== 'ipfs://QmPax47qCinP2c6hj77F4CBvB74VHsas2j8Dqa3TdGphZq/Vessel_0007.png') {
            throw new Error(`Unexpected image URI: ${m.image}`);
          }
          if (m.tier !== 'Common') {
            throw new Error(`Unexpected tier: ${m.tier}`);
          }
          const attrs = Array.isArray(m.attributes) ? m.attributes : [];
          const rarityTier = attrs.find((x) => x && x.trait_type === 'Rarity Tier')?.value;
          if (rarityTier !== 'Common') {
            throw new Error(`Unexpected Rarity Tier: ${rarityTier}`);
          }
          console.log('METADATA_GATEWAY: PASS');
          console.log('IMAGE_URI:', m.image);
          console.log('TIER:', m.tier);
          console.log('RARITY_TIER:', rarityTier);
          NODE

          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 35 \
            --range 0-63 "$IMAGE_URL" -o /tmp/image.bin

          test -s /tmp/image.bin
          echo "ARTWORK_GATEWAY: PASS"
          echo "FINAL_STATUS: FULL_PASS"
