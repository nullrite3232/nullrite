name: D16 CID Metadata Audit

on:
  push:
    branches:
      - audit/d15-seed-readback

jobs:
  d16-cid-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Audit public IPFS CID
        env:
          CID: 'bafybeiaawsoktrjvewjv4emu7bxsoyctftxtkmglardz3cex335c25b3ci'
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          from urllib.parse import urlparse

          cid = os.environ['CID']
          gateways = [
              'https://w3s.link/ipfs',
              'https://dweb.link/ipfs',
              'https://ipfs.io/ipfs',
          ]

          assignment = {1:7, 2:1, 3:9, 4:6, 5:3, 6:10, 7:2, 8:5, 9:4, 10:8}

          def fetch_http(url, timeout=20, max_bytes=None):
              req = urllib.request.Request(url, headers={'User-Agent': 'NULL-RITE-D16-AUDIT/1.0'})
              if max_bytes:
                  req.add_header('Range', f'bytes=0-{max_bytes-1}')
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  data = r.read(max_bytes or -1)
                  return r.status, r.headers.get('Content-Type', ''), data

          def fetch_ipfs_path(root_cid, path, max_bytes=None):
              errors = []
              for gateway in gateways:
                  url = f'{gateway}/{root_cid}/{path}'
                  try:
                      status, ctype, data = fetch_http(url, max_bytes=max_bytes)
                      if 200 <= status < 300:
                          return url, ctype, data
                  except Exception as e:
                      errors.append(f'{url} -> {type(e).__name__}: {e}')
              raise RuntimeError(' ; '.join(errors))

          def fetch_ipfs_uri(uri, max_bytes=64):
              if not isinstance(uri, str) or not uri.startswith('ipfs://'):
                  raise RuntimeError(f'Unsupported image URI: {uri!r}')
              rest = uri[len('ipfs://'):].lstrip('/')
              parts = rest.split('/', 1)
              root = parts[0]
              path = parts[1] if len(parts) == 2 else ''
              return fetch_ipfs_path(root, path, max_bytes=max_bytes)

          print('D16 CID AUDIT')
          print('CID:', cid)
          print('Mode: read-only / public gateways / no signer / no chain writes')
          print()

          # First classify the CID instead of assuming it is metadata.
          try:
              url, ctype, raw = fetch_ipfs_path(cid, '1.json')
              json.loads(raw.decode('utf-8'))
              print('CID_KIND: METADATA_DIRECTORY')
              print('1.json:', url, ctype)
          except Exception as metadata_error:
              print('1.json probe: NOT READABLE AS JSON')
              print(str(metadata_error)[:1200])
              try:
                  url, ctype, raw = fetch_ipfs_path(cid, 'Vessel_0001.png', max_bytes=64)
                  print('CID_KIND: IMAGE_DIRECTORY')
                  print('Vessel_0001.png:', url, ctype, 'sample_bytes=', len(raw))
                  print('RESULT: FAIL AS METADATA BASE URI')
                  print('This CID can be an image root, but reveal(baseURI) requires a directory containing 1.json..10.json.')
                  sys.exit(2)
              except Exception as image_error:
                  print('Vessel_0001.png probe also failed:')
                  print(str(image_error)[:1200])
                  print('CID_KIND: UNKNOWN/UNREACHABLE')
                  sys.exit(3)

          # Full metadata audit.
          seen_images = set()
          rows = []
          for token_id in range(1, 11):
              source_id = assignment[token_id]
              path = f'{token_id}.json'
              url, ctype, raw = fetch_ipfs_path(cid, path)
              try:
                  meta = json.loads(raw.decode('utf-8'))
              except Exception as e:
                  raise RuntimeError(f'{path}: invalid UTF-8 JSON: {e}')
              if not isinstance(meta, dict):
                  raise RuntimeError(f'{path}: top-level metadata must be object')

              image = meta.get('image')
              expected_png = f'Vessel_{source_id:04d}.png'
              actual_png = image.rstrip('/').split('/')[-1] if isinstance(image, str) else None
              if actual_png != expected_png:
                  raise RuntimeError(f'{path}: D15 mapping mismatch; expected image {expected_png}, got {actual_png!r}')
              if image in seen_images:
                  raise RuntimeError(f'{path}: duplicate image URI {image}')
              seen_images.add(image)

              tier = meta.get('tier')
              rarity_tier = None
              attrs = meta.get('attributes') if isinstance(meta.get('attributes'), list) else []
              for a in attrs:
                  if isinstance(a, dict) and str(a.get('trait_type','')).strip().lower().replace('_',' ') == 'rarity tier':
                      rarity_tier = a.get('value')
                      break
              if not tier and not rarity_tier:
                  raise RuntimeError(f'{path}: missing tier/Rarity Tier')

              body = None
              for a in attrs:
                  if isinstance(a, dict) and str(a.get('trait_type','')).strip().lower() == 'body':
                      body = a.get('value')
                      break

              image_url, image_ctype, sample = fetch_ipfs_uri(image, max_bytes=64)
              if len(sample) == 0:
                  raise RuntimeError(f'{path}: image URI returned zero bytes')

              rows.append((token_id, source_id, meta.get('name'), tier or rarity_tier, body, image, image_url, image_ctype))
              print(f'PASS {path}: token #{token_id} -> source #{source_id} -> {expected_png}; tier={tier or rarity_tier}; body={body}')

          if len(seen_images) != 10:
              raise RuntimeError(f'Expected 10 unique image URIs, got {len(seen_images)}')

          print()
          print('D15_MAPPING: PASS')
          print('JSON_1_TO_10: PASS')
          print('UNIQUE_IMAGES: 10/10 PASS')
          print('RARITY_DATA: 10/10 PASS')
          print('IMAGE_URI_FETCH: 10/10 PASS')
          print('REVEAL_BASE_URI:', f'ipfs://{cid}/')
          print('FINAL_STATUS: FULL PASS')
          PY
